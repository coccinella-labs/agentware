name: Tracking

on:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, reopened]

jobs:
  update-tracking:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Update tracking issue
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Every outcome is reported to the run log and the step
            // summary, so "no comment was posted" is distinguishable from
            // "the workflow is broken".
            const note = async (text) => {
              console.log(text);
              await core.summary.addRaw(text).write();
            };
            const trackingIssueNumber =
              '${{ vars.TRACKING_ISSUE_NUMBER }}';
            if (!trackingIssueNumber || trackingIssueNumber === '') {
              await note('Tracking: no tracking issue configured.');
              return;
            }
            const trackingNumber = parseInt(trackingIssueNumber, 10);
            if (Number.isNaN(trackingNumber)) {
              await note(
                'Tracking skipped: TRACKING_ISSUE_NUMBER is not a ' +
                'number: ' + trackingIssueNumber
              );
              return;
            }
            const { action } = context.payload;
            const isIssue = context.eventName === 'issues';
            const item =
              context.payload[isIssue ? 'issue' : 'pull_request'];
            if (!item || item.locked) {
              // Checked before the target lookup, so a locked item does
              // not cost an extra API call.
              await note(
                'Tracking skipped: triggering item not found or locked.'
              );
              return;
            }
            // Read the configured target's CURRENT state. This is not the
            // state of the item that triggered the run: a "closed" event
            // for an unrelated PR says nothing about the tracking issue.
            let trackingIssue;
            // This read is the gate for everything below. Nothing is
            // posted unless it succeeds and reports the target open, so
            // moving it after the post, or caching its result, silently
            // disables the fix this PR exists to make.
            try {
              const res = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: trackingNumber,
              });
              trackingIssue = res.data;
            } catch (err) {
              // Fail safe: post nothing. The reasons are reported
              // separately so a persistent misconfiguration does not
              // look like an idle tracker.
              const status = err.status;
              if (status === 404) {
                await note(
                  'Tracking skipped: issue #' + trackingNumber +
                  ' not found. Check TRACKING_ISSUE_NUMBER.'
                );
              } else if (status === 401 || status === 403) {
                await note(
                  'Tracking skipped: HTTP ' + status + ' reading #' +
                  trackingNumber + '. The workflow token is missing or ' +
                  'lacks permission. This is a configuration problem, ' +
                  'not an idle tracker.'
                );
              } else {
                await note(
                  'Tracking skipped: could not read #' + trackingNumber +
                  ': ' + err.message
                );
              }
              return;
            }
            if (trackingIssue.state !== 'open') {
              await note(
                'Tracking skipped: issue #' + trackingNumber + ' is ' +
                trackingIssue.state + '. Tracking is idle by design and ' +
                'resumes automatically once the target is open again.'
              );
              return;
            }
            const type = isIssue ? 'Issue' : 'PR';
            const state = item.state;
            const title = item.title;
            const createdAt =
              new Date(item.created_at).toISOString().split('T')[0];
            const updateMsg =
              '## Automated Update\n\n' +
              '**' + type + ' #' + item.number + '** - ' + action + '\n' +
              '- **Title**: ' + title + '\n' +
              '- **Status**: ' + state.toUpperCase() + '\n' +
              '- **Date**: ' + createdAt + '\n' +
              '- **Action**: ' + action + '\n\n' +
              '*This tracking issue will be manually updated with ' +
              'full context.*';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: trackingNumber,
              body: updateMsg
            });
            await note(
              'Tracking: posted ' + type + ' #' + item.number + ' to #' +
              trackingNumber + '.'
            );
