---
name: Release

"on":
  push:
    tags:
      - 'v*'
  # Manual escape hatch. Automated tag pushes made with GITHUB_TOKEN cannot
  # trigger this workflow, so a release created that way stays empty until
  # someone runs this by hand against its tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach binaries to (e.g. v0.1.6)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: agentware-linux
            ext: ''
          - os: macos-15
            artifact_name: agentware-macos
            ext: ''
          - os: windows-latest
            artifact_name: agentware-windows
            ext: .exe

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y nlohmann-json3-dev cmake build-essential \
            libcurl4-openssl-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-15'
        run: |
          # zlib is what makes CMAKE_PREFIX_PATH work here: without it
          # CMake finds no zlib and FetchContent pulls a vendored copy
          # that collides with the macOS SDK's fdopen declaration.
          brew update
          brew install cmake nlohmann-json curl zlib

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # Mirrors ci.yml exactly. The toolchain file on the Configure step
          # points at C:\vcpkg, so it has to be cloned, bootstrapped, and
          # populated with cpr and the headers. The toolchain alone is not
          # enough: an empty vcpkg tree yields Could NOT find CURL.
          powershell -Command "
            Set-ExecutionPolicy Bypass -Scope Process -Force;
            iwr https://chocolatey.org/install.ps1
            -UseBasicParsing | iex;
            choco install -y cmake --no-progress;
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg;
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics;
            C:\vcpkg\vcpkg.exe integrate install;
            C:\vcpkg\vcpkg.exe install cpr nlohmann-json libpqxx --triplet x64-windows
          "

      - name: Configure
        shell: bash
        run: |
          # Match CI: without /opt/homebrew on PATH, CMake falls back to
          # fetching zlib and curl, and the vendored zlib defines fdopen
          # as a no-op macro that collides with the macOS SDK declaration.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -S . -B build \
              -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
              -DCMAKE_BUILD_TYPE=Release
          else
            FLAGS=""
            [[ "$RUNNER_OS" == "macOS" ]] && \
              FLAGS="-DCMAKE_PREFIX_PATH=/opt/homebrew"
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $FLAGS
          fi

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          cp build/bin/agentware-agent${{ matrix.ext }} \
              release/${{ matrix.artifact_name }}${{ matrix.ext }}
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            7z a -tzip release-${{ matrix.artifact_name }}.zip release/*
          else
            tar -czvf release-${{ matrix.artifact_name }}.tar.gz release/*
          fi

      - name: Resolve tag
        # Manual runs carry the tag as an input; tag pushes carry it as the ref.
        run: |
          if [ "${{ inputs.tag }}" != "" ]; then
            echo "TAG_NAME=${{ inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: release-${{ matrix.artifact_name }}*
          draft: false
          prerelease: false
