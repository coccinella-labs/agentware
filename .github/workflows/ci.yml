---
name: CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: ["*"]
  # Required by the merge queue: without this, the required checks
  # never run on the queue synthetic merge commit and entries sit in
  # AWAITING_CHECKS until they time out.
  merge_group:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: write

# One in-flight run per branch (per PR number for pull requests). A new
# push to a pull request cancels the superseded run instead of leaving it
# to burn a runner, which is what made the macOS job sit in the queue
# for hours behind work that had already been replaced.
#
# cancel-in-progress is limited to pull_request events on purpose:
#   * pushes to main and merge_group runs are never cancelled, so a
#     merge queue entry is not killed by a later push, and
#   * two pushes to main queue up instead of cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.os_short }},
      ${{ matrix.build_type == 'Release' && 'release' || 'debug' }})
    runs-on: ${{ matrix.os }}
    # A stalled job must not hold a runner for hours. The macOS tool-loop
    # suite is the slow one (it runs 131 cases), so it gets the larger
    # budget; the Linux and Windows jobs finish in minutes.
    timeout-minutes: ${{ matrix.os_short == 'macos' && 30 || 25 }}
    if: github.repository_owner == 'coccinella-labs'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            os_short: ubuntu
            build_type: release
          - os: ubuntu-24.04
            os_short: ubuntu
            build_type: debug
          - os: macos-15
            os_short: macos
            build_type: release
          - os: macos-15
            os_short: macos
            build_type: debug
          - os: windows-latest
            os_short: windows
            build_type: release

    steps:
      - uses: actions/checkout@v6

      - name: cache
        uses: actions/cache@v5
        with:
          path: |
            build
            ~/.cache/vcpkg
            C:\vcpkg\installed
          key: |
            agentware-v2-${{ runner.os }}-${{ matrix.build_type }}
            -${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            agentware-v2-${{ runner.os }}-${{ matrix.build_type }}-

      - name: clean stale cache
        shell: bash
        run: |
          # A CMakeCache.txt restored from another workspace pins absolute paths
          # and silently misconfigures the build. Detect and drop it.
          if [ -d build ] && [ -f build/CMakeCache.txt ] &&
            ! grep -q "$GITHUB_WORKSPACE" build/CMakeCache.txt 2>/dev/null; then
            echo "Detected mismatched workspace path in CMakeCache
            - removing build directory"
            rm -rf build
          fi
          # A build directory configured by a different CMakeLists.txt carries
          # stale absolute paths and dependency choices (e.g. an SDK stub that
          # no longer exists). The stamp records which CMakeLists produced the
          # cache; a missing or mismatched stamp means unprovable, so drop it.
          STAMP="build/.cmake_lists_hash"
          CURRENT="${{ hashFiles('CMakeLists.txt') }}"
          if [ -d build ] && { [ ! -f "$STAMP" ] || [ "$(cat "$STAMP")" != "$CURRENT" ]; }; then
            echo "CMakeLists.txt changed since the cached build was configured
            - removing build directory"
            rm -rf build
          fi
          mkdir -p build
          echo "$CURRENT" > "$STAMP"

      - name: setup
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # See the note in the lint job: the image's Microsoft apt
            # source is not needed here and its 403s must not fail the
            # job.
            sudo sed -i '/packages\.microsoft\.com/d' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
              /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
              /etc/apt/sources.list.d/microsoft-prod.sources
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y nlohmann-json3-dev cmake build-essential \
              libcurl4-openssl-dev libpqxx-dev expect clang-tidy
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew update
            brew install cmake nlohmann-json libpqxx expect llvm curl zlib
          else
            powershell -Command "
              Set-ExecutionPolicy Bypass -Scope Process -Force;
              iwr https://chocolatey.org/install.ps1
              -UseBasicParsing | iex;
              choco install -y cmake --no-progress;
              git clone https://github.com/microsoft/vcpkg.git \
                C:\vcpkg;
              C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics;
              C:\vcpkg\vcpkg.exe integrate install;
              C:\vcpkg\vcpkg.exe install cpr nlohmann-json libpqxx \
                --triplet x64-windows
            "
          fi

      - name: build
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -S . -B build \
              -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          else
            FLAGS=""
            [[ "$RUNNER_OS" == "macOS" ]] && \
              FLAGS="-DCMAKE_PREFIX_PATH=/opt/homebrew"
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} $FLAGS
          fi
          cmake --build build --config ${{ matrix.build_type }}

      - name: test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Run the unit suite. This is the only CTest execution on Windows
            # and it was previously absent entirely, so POSIX-guarded tests
            # have never actually run there.
            ctest --test-dir build -C ${{ matrix.build_type }} \
              --output-on-failure -R basic_tests
          else
            # Gtest unit suite (Linux/macOS; Windows runs this separately).
            ctest --test-dir build --output-on-failure \
              -R 'basic_tests|cli_behavior'
            # The provider readiness wait, before the suites that depend on
            # it: a provider that comes up late or never comes up has to be
            # reported as that, not as an unrelated case failure.
            bash src/tests/provider_readiness_test.sh
            # The daily report generator's shape contract: the report
            # ends with exactly one newline and every section keeps the
            # blank line ahead of it, for both heading paths (copied
            # sections and NOT RUN stubs).
            bash src/tests/maintenance_report_test.sh
            # Offline golden suites (Linux/macOS only; Windows excluded
            # because the bash harness needs shebang support).
            bash src/tests/run_routing_golden.sh build/bin/agentware-agent
            AGENTWARE_TOOL_CALL_LOOP=1 bash src/tests/run_tool_loop_golden.sh \
              build/bin/agentware-agent
          fi

      - name: remediation probes
        shell: bash
        run: |
          # The probes assert real output markers for the command
          # surface and the path policy, which no other suite covers.
          # They run on Linux only: they are a bash harness and the
          # slowest of the suites.
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ctest --test-dir build --output-on-failure -R remediation_probes
          fi

      - name: grep goldens without ripgrep
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The native search fallback is only used on hosts that lack
          # ripgrep, so the runners never covered it: that is how a
          # pattern the regex engine rejects could report "no matches"
          # on one host and work on another. Run the grep cases with the
          # fallback forced, so both backends are covered everywhere.
          AGENTWARE_SEARCH_BACKEND=native \
            bash src/tests/run_routing_golden.sh build/bin/agentware-agent

      - name: note windows probe coverage
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "remediation_probes is deliberately excluded on Windows."
          echo "routing_golden is excluded here as well: like"
          echo "remediation_probes, it is a bash-driven harness and it is"
          echo "not compatible today, and the gap is documented rather"
          echo "than hidden:"
          echo "  * the harness writes '#!/bin/bash' stub executables that the"
          echo "    agent then execs, to stand in for docker. Windows"
          echo "    CreateProcess has no shebang support, so those stubs can"
          echo "    never run. That is the decisive blocker."
          echo "python3 is present on this runner and is not the problem."
          echo "Porting it needs .bat/.cmd stubs, which is a test-harness"
          echo "change beyond this CI repair."

      - uses: actions/upload-artifact@v6
        with:
          name: agentware-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/bin/agentware-agent*
            build/bin/Release/agentware-agent.exe

  coverage:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'release'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: |
          # See the note in the lint job: the image's Microsoft apt
          # source is not needed here and its 403s must not fail the job.
          sudo sed -i '/packages\.microsoft\.com/d' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update -o Acquire::http::Timeout=30 \
            -o Acquire::Retries=3
          sudo apt-get install -y nlohmann-json3-dev cmake build-essential \
            libcurl4-openssl-dev libpqxx-dev lcov
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target coverage
      - uses: codecov/codecov-action@v5
        with:
          files: build/coverage/coverage.info
          flags: unittests
          name: codecov
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: |
          # The runner image ships a Microsoft apt source that these
          # jobs do not need. It answers 403 at times, and a failing
          # "apt update" fails the job before a single line of the
          # project is looked at. Drop every source that points at it.
          # If the update still fails afterwards, the job fails: it
          # needs these packages.
          sudo sed -i '/packages\.microsoft\.com/d' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y clang-tidy cmake build-essential \
            libcurl4-openssl-dev nlohmann-json3-dev libpqxx-dev
      - name: clang-tidy
        run: make clang-tidy

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - run: |
          docker compose -f docker-compose.e2e.yml up \
          --abort-on-container-exit --exit-code-from e2e-tests
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-logs
          path: src/tests/e2e_test.log

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentware
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # fetch all history for tag comparison
      - name: check version change
        id: version_check
        shell: bash
        run: |
          if git diff --name-only HEAD~1 | grep -q "^VERSION$"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: release
        if: steps.version_check.outputs.changed == 'true'
        uses: ./.github/actions/release
        with:
          # Prefer RELEASE_TOKEN so the tag and release trigger the build
          # workflow. GITHUB_TOKEN cannot trigger new runs, which leaves the
          # release without binaries. Same fallback as version-bump.yml.
          token: ${
            { secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN
            || secrets.GITHUB_TOKEN }}
# CI workflow
