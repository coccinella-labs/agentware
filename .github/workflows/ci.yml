---
name: CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: ["*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  build:
    name: build (${{ matrix.os_short }},
      ${{ matrix.build_type == 'Release' && 'release' || 'debug' }})
    runs-on: ${{ matrix.os }}
    if: github.repository_owner == 'coccinella-labs'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            os_short: ubuntu
            build_type: release
          - os: ubuntu-24.04
            os_short: ubuntu
            build_type: debug
          - os: macos-15
            os_short: macos
            build_type: release
          - os: macos-15
            os_short: macos
            build_type: debug
          - os: windows-latest
            os_short: windows
            build_type: release

    steps:
      - uses: actions/checkout@v6

      - name: cache
        uses: actions/cache@v5
        with:
          path: |
            build
            ~/.cache/vcpkg
            C:\vcpkg\installed
          key: |
            agentware-v2-${{ runner.os }}-${{ matrix.build_type }}
            -${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            agentware-v2-${{ runner.os }}-${{ matrix.build_type }}-

      - name: clean stale cache
        shell: bash
        run: |
          # A CMakeCache.txt restored from another workspace pins absolute paths
          # and silently misconfigures the build. Detect and drop it.
          if [ -d build ] && [ -f build/CMakeCache.txt ] &&
            ! grep -q "$GITHUB_WORKSPACE" build/CMakeCache.txt 2>/dev/null; then
            echo "Detected mismatched workspace path in CMakeCache
            - removing build directory"
            rm -rf build
          fi
          # A build directory configured by a different CMakeLists.txt carries
          # stale absolute paths and dependency choices (e.g. an SDK stub that
          # no longer exists). The stamp records which CMakeLists produced the
          # cache; a missing or mismatched stamp means unprovable, so drop it.
          STAMP="build/.cmake_lists_hash"
          CURRENT="${{ hashFiles('CMakeLists.txt') }}"
          if [ -d build ] && { [ ! -f "$STAMP" ] || [ "$(cat "$STAMP")" != "$CURRENT" ]; }; then
            echo "CMakeLists.txt changed since the cached build was configured
            - removing build directory"
            rm -rf build
          fi
          mkdir -p build
          echo "$CURRENT" > "$STAMP"

      - name: setup
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt update
            sudo apt install -y nlohmann-json3-dev cmake build-essential \
              libcurl4-openssl-dev libpqxx-dev expect clang-tidy
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew update
            brew install cmake nlohmann-json libpqxx expect llvm curl zlib
          else
            powershell -Command "
              Set-ExecutionPolicy Bypass -Scope Process -Force;
              iwr https://chocolatey.org/install.ps1
              -UseBasicParsing | iex;
              choco install -y cmake --no-progress;
              git clone https://github.com/microsoft/vcpkg.git \
                C:\vcpkg;
              C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics;
              C:\vcpkg\vcpkg.exe integrate install;
              C:\vcpkg\vcpkg.exe install cpr nlohmann-json libpqxx \
                --triplet x64-windows
            "
          fi

      - name: build
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -S . -B build \
              -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          else
            FLAGS=""
            [[ "$RUNNER_OS" == "macOS" ]] && \
              FLAGS="-DCMAKE_PREFIX_PATH=/opt/homebrew"
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} $FLAGS
          fi
          cmake --build build --config ${{ matrix.build_type }}

      - name: test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Failures here must fail the job. This step previously ended in
            # '|| true', which masked both build and test failures outright.
            cmake --build build --target preflight \
              --config ${{ matrix.build_type }}
            # Run the unit suite. This is the only CTest execution on Windows
            # and it was previously absent entirely, so POSIX-guarded tests
            # have never actually run there.
            ctest --test-dir build -C ${{ matrix.build_type }} \
              --output-on-failure -R basic_tests
          else
            make preflight
          fi

      - name: note windows probe coverage
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "remediation_probes is deliberately excluded on Windows."
          echo "It is not compatible today, and the gap is documented rather"
          echo "than hidden:"
          echo "  * the harness writes '#!/bin/bash' stub executables that the"
          echo "    agent then execs; Windows CreateProcess has no shebang"
          echo "    support, so the stubs can never run."
          echo "  * it depends on python3 (Windows exposes python), curl, and"
          echo "    script(1) for its pty probe."
          echo "Porting it needs .bat/.cmd stubs and a tool shim, which is a"
          echo "test-harness change beyond this CI repair."

      - uses: actions/upload-artifact@v6
        with:
          name: agentware-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/bin/agentware-agent*
            build/bin/Release/agentware-agent.exe

  coverage:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'release'
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt update
          sudo apt install -y nlohmann-json3-dev cmake build-essential \
            libcurl4-openssl-dev libpqxx-dev lcov
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target coverage
      - uses: codecov/codecov-action@v5
        with:
          files: build/coverage/coverage.info
          flags: unittests
          name: codecov
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt update
          sudo apt install -y clang-tidy cmake build-essential \
            libcurl4-openssl-dev nlohmann-json3-dev libpqxx-dev
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          echo "Running basic syntax check..."
          clang-tidy --list-checks > /dev/null && echo "✅ Clang-tidy available"
          echo "✅ Lint check completed (detailed linting
          handled by pre-commit hooks)"

  e2e:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - run: |
          docker compose -f docker-compose.e2e.yml up \
          --abort-on-container-exit --exit-code-from e2e-tests
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-logs
          path: src/tests/e2e_test.log

  docker:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentware
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # fetch all history for tag comparison
      - name: check version change
        id: version_check
        shell: bash
        run: |
          if git diff --name-only HEAD~1 | grep -q "^VERSION$"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: release
        if: steps.version_check.outputs.changed == 'true'
        uses: ./.github/actions/release
        with:
          # Prefer RELEASE_TOKEN so the tag and release trigger the build
          # workflow. GITHUB_TOKEN cannot trigger new runs, which leaves the
          # release without binaries. Same fallback as version-bump.yml.
          token: ${
            { secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN
            || secrets.GITHUB_TOKEN }}
# CI workflow
