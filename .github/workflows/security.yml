name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types: ["published"]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: write
  id-token: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'coccinella-labs'
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: cpp
          config-file: ./.github/codeql/codeql-config.yml
      - run: |
          sudo apt update
          sudo apt install -y nlohmann-json3-dev cmake build-essential \
            libcurl4-openssl-dev libpqxx-dev
          cmake -S . -B build
          cmake --build build
      - uses: github/codeql-action/analyze@v4

  sast:
    name: sast
    runs-on: ubuntu-latest
    if: github.repository_owner == 'coccinella-labs'
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  release:
    name: release
    if: github.event_name == 'release' && github.repository_owner == 'coccinella-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt update
          sudo apt install -y nlohmann-json3-dev cmake build-essential \
            libcurl4-openssl-dev libpqxx-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          make preflight
          mkdir -p release
          cp build/bin/agentware-agent README.md LICENSE CHANGELOG.md release/
          tar -czf agentware-${{ github.event.release.tag_name }}.tar.gz -C release .
      - uses: softprops/action-gh-release@v2
        with:
          files: agentware-${{ github.event.release.tag_name }}.tar.gz

  agent:
    name: agent
    if: >
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.repository_owner == 'coccinella-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt update
          sudo apt install -y nlohmann-json3-dev cmake build-essential \
            libcurl4-openssl-dev libpqxx-dev
          cmake -S . -B build
          cmake --build build
          timeout 30s ./build/bin/agentware-agent << EOF
          2
          exit
          EOF
          echo "Build size: $(stat -c%s build/bin/agentware-agent) bytes"
          echo "Build date: $(date)"
          echo "Commit: ${{ github.sha }}"
