name: 'release'
description: 'creates github release'

inputs:
  token:
    description: 'github token'
    required: true

runs:
  using: 'composite'
  steps:
    - name: version
      id: version
      shell: bash
      run: |
        VERSION=$(cat VERSION | tr -d '\n')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT

    - name: check
      id: tag_check
      shell: bash
      run: |
        if git tag -l | grep -q "^v${{ steps.version.outputs.version }}$"; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: tag
      if: steps.tag_check.outputs.exists == 'false'
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "v${{ steps.version.outputs.version }}" -m "release v${{ steps.version.outputs.version }}"
        git push origin "v${{ steps.version.outputs.version }}"

    - name: notes
      id: release_notes
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        TAG="v${{ steps.version.outputs.version }}"

        # get previous tag
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
        # Guard against retags and rewritten history: the previous tag must be
        # a real ancestor and must not be the tag being released. Fall back to
        # the nearest tag excluding the new one, then to the root commit.
        if [ -n "$PREVIOUS_TAG" ] && { [ "$PREVIOUS_TAG" = "$TAG" ] || \
          ! git merge-base --is-ancestor "$PREVIOUS_TAG" "$TAG" 2>/dev/null; }; then
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --exclude="$TAG" HEAD 2>/dev/null || echo "")
        fi
        if [ -z "$PREVIOUS_TAG" ]; then
          PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
        fi

        # read template
        RELEASE_NOTES=$(cat .github/release-template.md | \
          sed "s/{previous_tag}/$PREVIOUS_TAG/g" | \
          sed "s/{current_tag}/$TAG/g")

        # Prefer the curated CHANGELOG entry for this version. The team pushes
        # directly to main, so the changelog is the written record; the commit
        # log below is only the fallback for versions without an entry.
        NOTES_FILE=$(mktemp)
        CHANGELOG_NOTES=$(awk -v ver="${{ steps.version.outputs.version }}" '
          $0 ~ "^## \\["ver"\\]" {insec=1; next}
          insec && /^## \\[/ {insec=0}
          insec {print}
        ' CHANGELOG.md | sed '/^[[:space:]]*$/d')
        if [ -n "$CHANGELOG_NOTES" ] && ! printf '%s\n' "$CHANGELOG_NOTES" | grep -qx '\*'; then
          printf '%s\n' "$CHANGELOG_NOTES" > "$NOTES_FILE"
        elif git rev-parse --verify "$PREVIOUS_TAG" >/dev/null 2>&1; then
          git log --pretty=format:'* %s (%h)' "${PREVIOUS_TAG}..${TAG}" > "$NOTES_FILE"
        else
          git log --pretty=format:'* %s (%h)' "$TAG" > "$NOTES_FILE"
        fi
        if [ ! -s "$NOTES_FILE" ]; then
          printf '%s\n' '(no commits since the previous tag)' > "$NOTES_FILE"
        fi
        RELEASE_NOTES=$(printf '%s\n' "$RELEASE_NOTES" | \
          sed -e "/{generated_notes}/ {" -e "r $NOTES_FILE" -e "d" -e "}")
        echo "notes<<AGENTWARE_RELEASE_NOTES_EOF" >> $GITHUB_OUTPUT
        printf '%s\n' "$RELEASE_NOTES" >> $GITHUB_OUTPUT
        echo "AGENTWARE_RELEASE_NOTES_EOF" >> $GITHUB_OUTPUT

    - name: release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: release ${{ steps.version.outputs.tag }}
        body: ${{ steps.release_notes.outputs.notes }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
